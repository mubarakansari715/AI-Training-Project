# ALLY AI theme: neutral light surfaces with an emerald accent matching the
# compass logo. Light only: with both light and dark variants defined, the
# app follows the computer's dark mode and `base` is ignored.

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 600, 600, 600, 500, 500]
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
primaryColor = "#047857"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f5"
textColor = "#18211d"
borderColor = "#dfe5e2"
linkColor = "#047857"
greenColor = "#047857"

[theme.sidebar]
backgroundColor = "#f6f8f7"
secondaryBackgroundColor = "#eaefec"
borderColor = "#dfe5e2"
